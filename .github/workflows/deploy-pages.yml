name: Deploy SYNTHOS to GitHub Pages

on:
  push:
    branches: ["claude/synthos-saas-plan-4d42w", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: synthos-site/package-lock.json

      - name: Install dependencies
        working-directory: synthos-site
        run: npm ci

      - name: Build static site
        working-directory: synthos-site
        run: npm run build

      - name: Add .nojekyll
        run: touch synthos-site/out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./synthos-site/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
