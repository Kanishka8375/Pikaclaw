[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pikaclaw"
version = "0.1.0"
description = "AI coding agent. Install and run in one command."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Kanishka" }]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "aiosqlite>=0.20",
    "cryptography>=42.0",
    "structlog>=24.0",
    "psutil>=5.9",
    "fastapi>=0.110",
    "uvicorn>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-timeout>=2.2", "ruff>=0.5"]
desktop = ["pywebview>=5.0"]

[project.scripts]
pikaclaw = "pikaclaw.cli:main"

[tool.setuptools.packages.find]
include = ["pikaclaw*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
