<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PikaClaw</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0d1117',
            sidebar: '#161b22',
            border: '#30363d',
            txt: '#c9d1d9',
            accent: '#58a6ff',
            muted: '#8b949e',
            userbg: '#1f3a5f',
            asstbg: '#1c2028',
            toolbg: '#1a1e26',
            danger: '#f85149',
            success: '#3fb950',
          }
        }
      }
    };
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0d1117; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #484f58; }
    textarea:focus { outline: none; }
    .markdown-body { line-height: 1.6; word-wrap: break-word; }
    .markdown-body p { margin-bottom: 0.5rem; }
    .markdown-body pre { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin: 8px 0; overflow-x: auto; }
    .markdown-body code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.85em; }
    .markdown-body code:not(pre code) { background: #1c2028; padding: 2px 6px; border-radius: 4px; }
    .markdown-body ul, .markdown-body ol { padding-left: 1.5rem; margin-bottom: 0.5rem; }
    .markdown-body blockquote { border-left: 3px solid #30363d; padding-left: 12px; color: #8b949e; margin: 8px 0; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin: 0.75rem 0 0.25rem; font-weight: 600; }
    .markdown-body a { color: #58a6ff; text-decoration: none; }
    .markdown-body a:hover { text-decoration: underline; }
    .markdown-body table { border-collapse: collapse; margin: 8px 0; }
    .markdown-body th, .markdown-body td { border: 1px solid #30363d; padding: 6px 12px; }
    .tool-card { transition: max-height 0.2s ease; }
    @keyframes pulse-dot { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    .loading-dot { animation: pulse-dot 1.2s infinite; }
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }
  </style>
</head>
<body class="bg-bg text-txt">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    const AGENTS = [
      { id: 'build', label: 'Build', icon: '⚡', desc: 'Generate & edit code' },
      { id: 'plan', label: 'Plan', icon: '📋', desc: 'Architect solutions' },
      { id: 'review', label: 'Review', icon: '🔍', desc: 'Analyze & improve' },
      { id: 'debug', label: 'Debug', icon: '🔧', desc: 'Find & fix issues' },
    ];

    const api = window.pywebview ? window.pywebview.api : {
      send_message: async (msg) => console.log('[mock] send_message:', msg),
      switch_agent: async (id) => console.log('[mock] switch_agent:', id),
      get_status: async () => ({ tokens: 0, cost: 0, session_id: 'dev-session' }),
      get_agents: async () => AGENTS.map(a => a.id),
      interrupt: async () => console.log('[mock] interrupt'),
    };

    function renderMarkdown(text) {
      if (!text) return '';
      const renderer = new marked.Renderer();
      renderer.code = function (code, lang) {
        const validLang = lang && hljs.getLanguage(lang);
        const highlighted = validLang
          ? hljs.highlight(code, { language: lang }).value
          : hljs.highlightAuto(code).value;
        return `<pre><code class="hljs ${lang || ''}">${highlighted}</code></pre>`;
      };
      marked.setOptions({ renderer, breaks: true, gfm: true });
      return marked.parse(text);
    }

    function LoadingDots() {
      return (
        <div className="flex items-center gap-1 px-3 py-2">
          <span className="loading-dot w-2 h-2 bg-accent rounded-full inline-block" />
          <span className="loading-dot w-2 h-2 bg-accent rounded-full inline-block" />
          <span className="loading-dot w-2 h-2 bg-accent rounded-full inline-block" />
        </div>
      );
    }

    function ToolCallCard({ tool }) {
      const [expanded, setExpanded] = useState(false);
      const hasResult = tool.result !== undefined;
      const statusColor = hasResult ? (tool.error ? 'text-danger' : 'text-success') : 'text-accent';
      const statusIcon = hasResult ? (tool.error ? '✗' : '✓') : '⟳';

      return (
        <div className="my-2 border border-border rounded-lg overflow-hidden bg-toolbg">
          <button
            className="w-full flex items-center gap-2 px-3 py-2 text-sm hover:bg-sidebar/50 transition-colors"
            onClick={() => setExpanded(!expanded)}
          >
            <span className={`font-mono text-xs ${statusColor}`}>{statusIcon}</span>
            <span className="font-mono text-accent text-xs">{tool.name}</span>
            <span className="text-muted text-xs ml-auto">{expanded ? '▲' : '▼'}</span>
          </button>
          {expanded && (
            <div className="px-3 pb-3 border-t border-border">
              {tool.params && (
                <div className="mt-2">
                  <div className="text-xs text-muted mb-1">Parameters</div>
                  <pre className="text-xs bg-bg p-2 rounded border border-border overflow-x-auto">
                    <code>{JSON.stringify(tool.params, null, 2)}</code>
                  </pre>
                </div>
              )}
              {hasResult && (
                <div className="mt-2">
                  <div className="text-xs text-muted mb-1">Result</div>
                  <pre className="text-xs bg-bg p-2 rounded border border-border overflow-x-auto max-h-48 overflow-y-auto">
                    <code>{typeof tool.result === 'string' ? tool.result : JSON.stringify(tool.result, null, 2)}</code>
                  </pre>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function ChatMessage({ message }) {
      if (message.role === 'user') {
        return (
          <div className="flex justify-end mb-4">
            <div className="max-w-[75%] bg-userbg border border-accent/20 rounded-xl rounded-br-sm px-4 py-3">
              <p className="text-sm whitespace-pre-wrap">{message.content}</p>
            </div>
          </div>
        );
      }

      return (
        <div className="flex justify-start mb-4">
          <div className="max-w-[85%]">
            {message.content && (
              <div
                className="markdown-body text-sm bg-asstbg border border-border rounded-xl rounded-bl-sm px-4 py-3"
                dangerouslySetInnerHTML={{ __html: renderMarkdown(message.content) }}
              />
            )}
            {message.toolCalls && message.toolCalls.map((tool, i) => (
              <ToolCallCard key={i} tool={tool} />
            ))}
          </div>
        </div>
      );
    }

    function Sidebar({ activeAgent, onAgentSwitch, onNewChat, onSettings }) {
      return (
        <div className="w-[250px] min-w-[250px] h-full bg-sidebar border-r border-border flex flex-col">
          <div className="px-4 py-5 border-b border-border">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-lg bg-accent/20 flex items-center justify-center text-lg">⚡</div>
              <div>
                <h1 className="text-base font-bold text-txt tracking-tight">PikaClaw</h1>
                <p className="text-[10px] text-muted leading-tight">AI Agent Framework</p>
              </div>
            </div>
          </div>

          <div className="px-3 pt-4 pb-2">
            <p className="text-[10px] font-semibold text-muted uppercase tracking-wider px-2 mb-2">Agents</p>
          </div>
          <div className="flex-1 px-3 space-y-1 overflow-y-auto">
            {AGENTS.map(agent => (
              <button
                key={agent.id}
                onClick={() => onAgentSwitch(agent.id)}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-all
                  ${activeAgent === agent.id
                    ? 'bg-accent/15 text-accent border border-accent/30'
                    : 'text-muted hover:text-txt hover:bg-bg/50 border border-transparent'}`}
              >
                <span className="text-base">{agent.icon}</span>
                <div className="text-left">
                  <div className="font-medium">{agent.label}</div>
                  <div className="text-[10px] opacity-60">{agent.desc}</div>
                </div>
              </button>
            ))}
          </div>

          <div className="border-t border-border p-3 space-y-1">
            <button
              onClick={onNewChat}
              className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-muted hover:text-txt hover:bg-bg/50 transition-colors"
            >
              <span>+</span>
              <span>New Chat</span>
            </button>
            <button
              onClick={onSettings}
              className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-muted hover:text-txt hover:bg-bg/50 transition-colors"
            >
              <span>⚙</span>
              <span>Settings</span>
            </button>
          </div>
        </div>
      );
    }

    function TopBar({ activeAgent, model, loading, onStop }) {
      const agent = AGENTS.find(a => a.id === activeAgent);
      return (
        <div className="h-12 min-h-[48px] border-b border-border flex items-center px-4 gap-3 bg-sidebar/50">
          {agent && (
            <span className="flex items-center gap-1.5 bg-accent/10 text-accent text-xs font-medium px-2.5 py-1 rounded-full border border-accent/20">
              <span>{agent.icon}</span>
              <span>{agent.label} Agent</span>
            </span>
          )}
          <span className="text-xs text-muted font-mono">{model || 'claude-sonnet-4-20250514'}</span>
          <div className="ml-auto">
            {loading && (
              <button
                onClick={onStop}
                className="flex items-center gap-1.5 px-3 py-1.5 bg-danger/10 text-danger text-xs font-medium rounded-lg border border-danger/30 hover:bg-danger/20 transition-colors"
              >
                <span>■</span>
                <span>Stop</span>
              </button>
            )}
          </div>
        </div>
      );
    }

    function ChatInput({ onSend, disabled }) {
      const [text, setText] = useState('');
      const textareaRef = useRef(null);

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      };

      const handleSend = () => {
        const trimmed = text.trim();
        if (!trimmed || disabled) return;
        onSend(trimmed);
        setText('');
        if (textareaRef.current) textareaRef.current.style.height = '44px';
      };

      const handleInput = (e) => {
        setText(e.target.value);
        const el = e.target;
        el.style.height = '44px';
        el.style.height = Math.min(el.scrollHeight, 160) + 'px';
      };

      return (
        <div className="border-t border-border p-4 bg-sidebar/30">
          <div className="flex items-end gap-2 max-w-4xl mx-auto">
            <div className="flex-1 relative">
              <textarea
                ref={textareaRef}
                value={text}
                onChange={handleInput}
                onKeyDown={handleKeyDown}
                disabled={disabled}
                placeholder={disabled ? 'Waiting for response...' : 'Type a message... (Enter to send, Shift+Enter for newline)'}
                className="w-full bg-bg border border-border rounded-xl px-4 py-3 text-sm text-txt placeholder-muted resize-none focus:border-accent/50 transition-colors disabled:opacity-50"
                rows={1}
                style={{ height: '44px', maxHeight: '160px' }}
              />
            </div>
            <button
              onClick={handleSend}
              disabled={disabled || !text.trim()}
              className="h-[44px] px-4 bg-accent text-bg font-medium text-sm rounded-xl hover:bg-accent/90 transition-colors disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-1.5"
            >
              <span>Send</span>
              <span className="text-xs">↵</span>
            </button>
          </div>
        </div>
      );
    }

    function StatusBar({ tokens, cost, sessionId }) {
      return (
        <div className="h-7 min-h-[28px] border-t border-border flex items-center px-4 gap-4 bg-sidebar text-[11px] text-muted">
          <span className="flex items-center gap-1">
            <span className="opacity-60">Tokens:</span>
            <span className="font-mono">{(tokens || 0).toLocaleString()}</span>
          </span>
          <span className="flex items-center gap-1">
            <span className="opacity-60">Cost:</span>
            <span className="font-mono">${(cost || 0).toFixed(4)}</span>
          </span>
          <span className="ml-auto flex items-center gap-1">
            <span className="opacity-60">Session:</span>
            <span className="font-mono">{sessionId || '---'}</span>
          </span>
        </div>
      );
    }

    function App() {
      const [activeAgent, setActiveAgent] = useState('build');
      const [messages, setMessages] = useState([]);
      const [loading, setLoading] = useState(false);
      const [status, setStatus] = useState({ tokens: 0, cost: 0, session_id: null });
      const [model, setModel] = useState('');
      const chatEndRef = useRef(null);
      const currentAssistantRef = useRef(null);

      const scrollToBottom = useCallback(() => {
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, []);

      useEffect(() => { scrollToBottom(); }, [messages, scrollToBottom]);

      useEffect(() => {
        const handler = (e) => {
          const { type, data } = e.detail || {};

          if (type === 'text') {
            setMessages(prev => {
              const updated = [...prev];
              const last = updated[updated.length - 1];
              if (last && last.role === 'assistant') {
                updated[updated.length - 1] = { ...last, content: (last.content || '') + data };
              } else {
                updated.push({ role: 'assistant', content: data, toolCalls: [] });
              }
              return updated;
            });
          } else if (type === 'tool_call') {
            setMessages(prev => {
              const updated = [...prev];
              const last = updated[updated.length - 1];
              if (last && last.role === 'assistant') {
                const toolCalls = [...(last.toolCalls || []), { name: data.name, params: data.params }];
                updated[updated.length - 1] = { ...last, toolCalls };
              } else {
                updated.push({ role: 'assistant', content: '', toolCalls: [{ name: data.name, params: data.params }] });
              }
              return updated;
            });
          } else if (type === 'tool_result') {
            setMessages(prev => {
              const updated = [...prev];
              const last = updated[updated.length - 1];
              if (last && last.role === 'assistant' && last.toolCalls && last.toolCalls.length > 0) {
                const toolCalls = [...last.toolCalls];
                const targetIdx = toolCalls.findIndex(t => t.name === data.name && t.result === undefined);
                if (targetIdx !== -1) {
                  toolCalls[targetIdx] = { ...toolCalls[targetIdx], result: data.result, error: data.error };
                }
                updated[updated.length - 1] = { ...last, toolCalls };
              }
              return updated;
            });
          } else if (type === 'done') {
            setLoading(false);
            if (data) {
              setStatus(prev => ({
                ...prev,
                tokens: data.tokens || prev.tokens,
                cost: data.cost || prev.cost,
              }));
            }
          } else if (type === 'error') {
            setLoading(false);
            setMessages(prev => [
              ...prev,
              { role: 'assistant', content: `**Error:** ${data.message || 'An unexpected error occurred.'}`, toolCalls: [] }
            ]);
          } else if (type === 'status') {
            if (data.model) setModel(data.model);
            if (data.session_id) setStatus(prev => ({ ...prev, session_id: data.session_id }));
          }
        };

        window.addEventListener('pikaclaw', handler);
        return () => window.removeEventListener('pikaclaw', handler);
      }, []);

      useEffect(() => {
        (async () => {
          try {
            const s = await api.get_status();
            if (s) setStatus(s);
          } catch (_) {}
        })();
      }, []);

      const handleSend = useCallback(async (text) => {
        setMessages(prev => [...prev, { role: 'user', content: text }]);
        setLoading(true);
        try {
          await api.send_message(text);
        } catch (err) {
          setLoading(false);
          setMessages(prev => [
            ...prev,
            { role: 'assistant', content: `**Error:** ${err.message || 'Failed to send message.'}`, toolCalls: [] }
          ]);
        }
      }, []);

      const handleAgentSwitch = useCallback(async (id) => {
        setActiveAgent(id);
        try {
          await api.switch_agent(id);
        } catch (_) {}
      }, []);

      const handleNewChat = useCallback(() => {
        setMessages([]);
        setStatus(prev => ({ ...prev, tokens: 0, cost: 0 }));
      }, []);

      const handleStop = useCallback(async () => {
        try {
          await api.interrupt();
        } catch (_) {}
        setLoading(false);
      }, []);

      const handleSettings = useCallback(() => {
        setMessages(prev => [
          ...prev,
          { role: 'assistant', content: 'Settings panel coming soon.', toolCalls: [] }
        ]);
      }, []);

      return (
        <div className="flex h-full">
          <Sidebar
            activeAgent={activeAgent}
            onAgentSwitch={handleAgentSwitch}
            onNewChat={handleNewChat}
            onSettings={handleSettings}
          />
          <div className="flex-1 flex flex-col min-w-0">
            <TopBar
              activeAgent={activeAgent}
              model={model}
              loading={loading}
              onStop={handleStop}
            />
            <div className="flex-1 overflow-y-auto px-6 py-4">
              {messages.length === 0 ? (
                <div className="h-full flex flex-col items-center justify-center text-center">
                  <div className="w-16 h-16 rounded-2xl bg-accent/10 flex items-center justify-center text-3xl mb-4 border border-accent/20">⚡</div>
                  <h2 className="text-xl font-semibold text-txt mb-2">PikaClaw</h2>
                  <p className="text-sm text-muted max-w-md">
                    AI-powered coding agent. Select an agent from the sidebar and start a conversation.
                  </p>
                  <div className="grid grid-cols-2 gap-3 mt-6 max-w-sm">
                    {AGENTS.map(agent => (
                      <button
                        key={agent.id}
                        onClick={() => handleAgentSwitch(agent.id)}
                        className={`flex items-center gap-2 px-4 py-3 rounded-xl text-sm border transition-all
                          ${activeAgent === agent.id
                            ? 'border-accent/40 bg-accent/10 text-accent'
                            : 'border-border bg-sidebar/50 text-muted hover:text-txt hover:border-border'}`}
                      >
                        <span>{agent.icon}</span>
                        <span>{agent.label}</span>
                      </button>
                    ))}
                  </div>
                </div>
              ) : (
                <div className="max-w-4xl mx-auto">
                  {messages.map((msg, i) => (
                    <ChatMessage key={i} message={msg} />
                  ))}
                  {loading && <LoadingDots />}
                  <div ref={chatEndRef} />
                </div>
              )}
            </div>
            <ChatInput onSend={handleSend} disabled={loading} />
            <StatusBar tokens={status.tokens} cost={status.cost} sessionId={status.session_id} />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
